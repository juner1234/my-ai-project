<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>把星星送回家 · 短片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142235;color:#f5e2c3;font-family:system-ui,sans-serif;text-align:center;padding:24px 16px}h1{font-size:24px;margin:0 0 8px}p{color:#afc1d7;font-size:14px}video{display:block;margin:20px auto;width:auto;max-width:100%;height:72vh;height:72svh;max-height:960px;background:#000;border-radius:12px;box-shadow:0 12px 50px #0006}#status{max-width:480px;margin:auto;min-height:24px;color:#ffd6ad}button,select{padding:9px 18px;border:1px solid #8297ae;border-radius:8px;color:#f5e2c3;background:#263c55;cursor:pointer}button:focus-visible,video:focus-visible,select:focus-visible{outline:3px solid #f5cf8c;outline-offset:4px}.note{max-width:520px;margin:14px auto;line-height:1.7}
</style>
</head>
<body><main>
<h1>把星星送回家</h1>
<p>42 秒原创动态绘本 · 点击播放，开启声音</p>
<label for="edition">观看版本：</label>
<select id="edition"><option value="v6">第六版 · Reverie 配乐版</option><option value="v5">第五版 · 无配乐对比</option><option value="v2">第二版 · 构图对比</option><option value="v4">第四版 · 对比观看</option><option value="v3">第三版 · 对比观看</option></select>
<video id="film" aria-label="把星星送回家，42秒短片" tabindex="0" controls playsinline preload="metadata" poster="video/poster_v6.jpg">
<source src="video/bring_the_star_home_v6.mp4" type="video/mp4">
你的浏览器不支持 HTML5 视频播放。
</video>
<p id="status" role="status" aria-live="polite">正在加载视频…</p>
<button id="retry" hidden>重新加载</button>
<p class="note" id="edition-note">第六版：第五版画面搭配《Reverie》，保留环境音与情节音效。</p>
<p class="note">第六版配乐：Reverie — Scott Buckley<br><a style="color:#d6bd91" href="https://www.scottbuckley.com.au/library/" target="_blank" rel="noopener noreferrer">作者音乐库</a> · 节选、淡入淡出及混音</p>
</main>
<script>
const film=document.getElementById('film');
const status=document.getElementById('status');
const retry=document.getElementById('retry');
function failed(){status.textContent='视频加载失败，请检查网络后重试。';retry.hidden=false;}
film.addEventListener('loadedmetadata',()=>{status.textContent='点击画面中的播放按钮即可观看';retry.hidden=true;});
film.addEventListener('playing',()=>status.textContent='正在播放');
film.addEventListener('pause',()=>{if(!film.ended)status.textContent='已暂停';});
film.addEventListener('waiting',()=>status.textContent='正在缓冲…');
film.addEventListener('ended',()=>status.textContent='播放结束，可以再次播放');
film.addEventListener('error',failed);
document.querySelector('video source').addEventListener('error',failed);
retry.addEventListener('click',()=>{status.textContent='正在重新加载…';retry.hidden=true;film.load();});
document.getElementById('edition').addEventListener('change',event=>{
  const version=event.target.value;
  film.pause();
  film.poster=`video/poster_${version}.jpg`;
  document.querySelector('video source').src=`video/bring_the_star_home_${version}.mp4`;
  const notes={v6:'第六版：第五版画面搭配《Reverie》，保留环境音与情节音效。',v5:'第五版：以第二版六幕构图与人物占比为基准，更新人物细节与字幕。当前仅含环境音与音效；已选配乐《Reverie》尚未加入。',v4:'第四版：调整捧星星与电车两幕的人物比例，保留其他景别。当前仅含环境音与音效；已选配乐《Reverie》尚未加入。',v3:'第三版：新角色、书页式字幕与柔和光效。当前为画面预览，仅含环境音与音效；已选配乐《Reverie》尚未加入。',v2:'第二版：原角色与 lo-fi 配乐，供对比观看。'};
  document.getElementById('edition-note').textContent=notes[version];
  status.textContent='正在切换版本…';retry.hidden=true;film.load();
});
</script>
</body>
</html>
