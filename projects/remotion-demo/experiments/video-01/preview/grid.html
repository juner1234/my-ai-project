<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>SIGNAL — 关键帧对照</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .grid { display: flex; gap: 24px; padding: 40px; }
  .cell { text-align: center; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
  .label .sub { display: block; font-size: 15px; font-weight: 400; color: #999; margin-top: 4px; }
  img { width: 360px; height: 640px; display: block; border: 1px solid #333; }
  h1 { font-size: 28px; margin: 32px 0 0 40px; letter-spacing: 2px; }
  .meta { color: #777; font-size: 14px; margin: 8px 0 0 40px; }
</style>
</head>
<body>
  <h1>SIGNAL — 五阶段关键帧对照图</h1>
  <p class="meta">1080×1920 · 30fps · 255帧 (8.5s) · Signal composition · 提取于代表帧</p>
  <div class="grid">
    <div class="cell">
      <div class="label">Shot 01<span class="sub">F15 · 信号出现</span></div>
      <img src="f15-shot.png" alt="F15">
    </div>
    <div class="cell">
      <div class="label">Shot 02<span class="sub">F60 · 信号传播</span></div>
      <img src="f60-shot.png" alt="F60">
    </div>
    <div class="cell">
      <div class="label">Shot 03<span class="sub">F120 · 信号干扰</span></div>
      <img src="f120-shot.png" alt="F120">
    </div>
    <div class="cell">
      <div class="label">Shot 04<span class="sub">F185 · 信号失控</span></div>
      <img src="f185-shot.png" alt="F185">
    </div>
    <div class="cell">
      <div class="label">Shot 05<span class="sub">F235 · 信号重构</span></div>
      <img src="f235-shot.png" alt="F235">
    </div>
  </div>
</body>
</html>
